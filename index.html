<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 sm:p-8 rounded-lg shadow-md w-full max-w-lg">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">HideFile</h2>

        <div class="mb-6">
            <div class="flex flex-wrap items-center justify-between mb-2 gap-2">
                <label class="block text-gray-700 text-sm font-bold" for="coverImgInput">
                    1. 表面圖片
                </label>
                <div class="flex items-center gap-2 bg-gray-50 px-2 py-1 rounded border border-gray-200">
                    <label class="text-gray-700 text-sm font-bold whitespace-nowrap" for="passwordInput">密碼</label>
                    <input type="text" id="passwordInput" value="8964" class="border border-gray-300 rounded px-2 py-1 text-sm w-20 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>
            </div>

            <input type="file" id="coverImgInput" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 file:cursor-pointer cursor-pointer mb-3">

            <div id="previewArea" class="w-full h-48 bg-gray-50 border-2 border-dashed border-gray-300 flex items-center justify-center rounded overflow-hidden p-2">
                <img id="previewImg" src="" alt="表面圖片預覽" class="max-h-full object-contain">
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="hiddenFileInput">
                2. 選擇要壓縮並隱藏的檔案 (可多選)
            </label>
            <input type="file" id="hiddenFileInput" multiple class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 file:cursor-pointer cursor-pointer mb-3">
            <div class="flex flex-wrap items-center gap-2 bg-gray-50 px-3 py-2 rounded border border-gray-200">
                <label class="text-gray-700 text-sm font-bold whitespace-nowrap">分割設定</label>
                <select id="splitType" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500 bg-white">
                    <option value="size">依大小 (MB)</option>
                    <option value="count">依數量 (等分)</option>
                </select>
                <input type="number" id="splitValue" value="0" min="0" step="0.1" class="border border-gray-300 rounded px-2 py-1 text-sm w-20 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            </div>
        </div>

        <button id="mergeBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-150 ease-in-out mb-6">
            壓縮合併並下載
        </button>

        <p id="msg" class="mb-4 text-sm text-center hidden"></p>

        <div class="bg-gray-100 rounded-md p-3 overflow-x-auto shadow-inner border flex flex-col gap-2 mb-3">
            <p class="text-sm font-bold text-gray-700 mb-1">手動製作隱藏圖片指令參考：</p>
            <div class="flex items-center gap-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-bold py-1 rounded shadow-sm select-none w-20 text-center shrink-0">Windows</span>
                <code id="cmd-win-single" class="text-gray-700 font-mono text-sm whitespace-nowrap cursor-pointer hover:bg-gray-200 px-1 rounded transition-colors" title="點擊複製" onclick="copyToClipboard(this)">copy /b 圖片.jpg + 隱藏檔案.zip 輸出圖片.jpg</code>
            </div>
            <div class="flex items-center gap-2">
                <span class="bg-orange-100 text-orange-800 text-xs font-bold py-1 rounded shadow-sm select-none w-20 text-center shrink-0">Linux</span>
                <code id="cmd-linux-single" class="text-gray-700 font-mono text-sm whitespace-nowrap cursor-pointer hover:bg-gray-200 px-1 rounded transition-colors" title="點擊複製" onclick="copyToClipboard(this)">cat 圖片.jpg 隱藏檔案.zip > 輸出圖片.jpg</code>
            </div>
        </div>



        <hr class="my-6 border-gray-300">

        <h2 class="text-xl font-bold text-gray-800 mb-4">3. 線上合併分割圖片 (還原碎片)</h2>

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">上傳所有分割圖片 (可多選)：</label>
            <input type="file" id="splitPartsInput" multiple accept="image/*,.zip" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 file:cursor-pointer cursor-pointer mb-3">
        </div>

        <button id="restoreMergeBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-150 ease-in-out mb-2">
            開始還原合併並下載
        </button>
        <p id="restoreMsg" class="mb-4 text-sm text-center hidden"></p>

        <div id="splitInstructionBlock" class="bg-gray-100 rounded-md p-3 overflow-x-auto shadow-inner border flex flex-col gap-2 mt-4">
            <p class="text-sm font-bold text-gray-700 mb-1">若有分割檔案，請依序執行以下指令還原：</p>
            <div class="flex items-start gap-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-bold py-1 rounded shadow-sm select-none w-20 text-center shrink-0 mt-1">Windows</span>
                <code id="cmd-win-split" class="text-gray-700 font-mono text-sm whitespace-pre-wrap cursor-pointer hover:bg-gray-200 px-2 py-1 rounded transition-colors w-full" title="點擊複製" onclick="copyToClipboard(this)">FOR %I IN ("壓縮檔.zip") DO tar -xf "%I"
copy /b 壓縮檔.zip.* 合併.zip</code>
            </div>
            <div class="flex items-start gap-2">
                <span class="bg-orange-100 text-orange-800 text-xs font-bold py-1 rounded shadow-sm select-none w-20 text-center shrink-0 mt-1">Linux</span>
                <code id="cmd-linux-split" class="text-gray-700 font-mono text-sm whitespace-pre-wrap cursor-pointer hover:bg-gray-200 px-2 py-1 rounded transition-colors w-full" title="點擊複製" onclick="copyToClipboard(this)">unzip -o '壓縮檔.zip'
cat 壓縮檔.zip.* > 合併.zip</code>
            </div>
        </div>
    </div>

    <script>
        function copyToClipboard(el) {
            const text = el.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const originalTitle = el.title;
                el.title = '已複製！';
                const originalBg = el.style.backgroundColor;
                el.style.backgroundColor = '#dcfce7';
                setTimeout(() => {
                    el.title = originalTitle;
                    el.style.backgroundColor = originalBg;
                }, 1000);
            }).catch(err => {
                console.error('複製失敗:', err);
                alert('複製失敗');
            });
        }

        const coverImgInput = document.getElementById('coverImgInput');
        const previewImg = document.getElementById('previewImg');
        const passwordInput = document.getElementById('passwordInput');

        let userCoverImgFile = null;

        // 初始化預設圖片
        previewImg.src = defaultBase64Image;

        // 處理表面圖片上傳與預覽
        coverImgInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    userCoverImgFile = file;
                }
                reader.readAsDataURL(file);
            } else {
                previewImg.src = defaultBase64Image;
                userCoverImgFile = null;
            }
        });
        const splitType = document.getElementById('splitType');
        const splitValue = document.getElementById('splitValue');

        document.getElementById('mergeBtn').addEventListener('click', async function() {
            const hiddenFiles = document.getElementById('hiddenFileInput').files;
            const msgEl = document.getElementById('msg');
            const btn = this;

            if (hiddenFiles.length === 0) {
                msgEl.textContent = '請至少選擇一個要隱藏的檔案。';
                msgEl.className = 'mb-4 text-sm text-center text-red-500';
                msgEl.classList.remove('hidden');
                return;
            }

            msgEl.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = '處理中...';

            try {
                const now = new Date();
                const yyyy = now.getFullYear();
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                const hh = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                const ss = String(now.getSeconds()).padStart(2, '0');
                const timeStr = `${yyyy}${mm}${dd}${hh}${min}`;

                let coverBlob;
                let finalMimeType = 'image/png';
                let finalFileName = `PrintTestPage_${timeStr}.png`;

                // 處理自訂圖片的檔名，避免產生 .jpg.jpeg 的問題
                if (userCoverImgFile) {
                    coverBlob = userCoverImgFile;
                    finalMimeType = userCoverImgFile.type;

                    const originalName = userCoverImgFile.name;
                    const lastDotIndex = originalName.lastIndexOf('.');

                    if (lastDotIndex !== -1) {
                        const ext = originalName.substring(lastDotIndex);
                        finalFileName = `PrintTestPage_${timeStr}${ext}`;
                    } else {
                        finalFileName = `PrintTestPage_${timeStr}`;
                    }
                } else {
                    const res = await fetch(defaultBase64Image);
                    coverBlob = await res.blob();
                }

                // 取得使用者設定的密碼
                const currentPassword = passwordInput.value || '';

                // 取得分割設定
                const type = splitType.value;
                const val = parseFloat(splitValue.value) || 0;

                // 壓縮所有的隱藏檔案為單一 ZIP
                const innerZipWriter = new zip.ZipWriter(new zip.BlobWriter("application/zip"), {
                    password: currentPassword
                });
                for (let i = 0; i < hiddenFiles.length; i++) {
                    await innerZipWriter.add(hiddenFiles[i].name, new zip.BlobReader(hiddenFiles[i]));
                }
                const innerZipBlob = await innerZipWriter.close();

                // 根據設定對產生的 ZIP Blob 進行二進位分割
                let blobParts = [];
                if (val <= 0) {
                    blobParts.push(innerZipBlob);
                } else if (type === 'count') {
                    const count = Math.max(1, Math.floor(val));
                    const chunkSize = Math.ceil(innerZipBlob.size / count);
                    for (let i = 0; i < innerZipBlob.size; i += chunkSize) {
                        blobParts.push(innerZipBlob.slice(i, i + chunkSize));
                    }
                } else if (type === 'size') {
                    const chunkSize = val * 1024 * 1024; // MB to bytes
                    for (let i = 0; i < innerZipBlob.size; i += chunkSize) {
                        blobParts.push(innerZipBlob.slice(i, i + chunkSize));
                    }
                }

                if (blobParts.length <= 1) {
                    // 單一圖片合併下載
                    const combinedBlob = new Blob([coverBlob, innerZipBlob], { type: finalMimeType });

                    const downloadUrl = URL.createObjectURL(combinedBlob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = finalFileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(downloadUrl);
                } else {
                    // 產生多張分割圖 -> 裝入主 ZIP
                    msgEl.textContent = '處理中：產生多張分割圖片並壓縮中...';
                    msgEl.className = 'mb-4 text-sm text-center text-blue-500';
                    msgEl.classList.remove('hidden');

                    const masterZipWriter = new zip.ZipWriter(new zip.BlobWriter("application/zip"));

                    const extMatch = finalFileName.match(/(\.[^.]+)$/);
                    const ext = extMatch ? extMatch[1] : '';
                    const baseName = finalFileName.replace(/(\.[^.]+)$/, '');

                    for (let i = 0; i < blobParts.length; i++) {
                        // 將分割出的二進位區塊，再次裝進一個沒有密碼的 ZIP 結構中
                        // 這樣能確保每一張圖在合併前，都是合法的 ZIP 結構
                        const partZipWriter = new zip.ZipWriter(new zip.BlobWriter("application/zip"));
                        const partExt = String(i + 1).padStart(3, '0'); // 001, 002...
                        await partZipWriter.add(`${baseName}_hidden.zip.${partExt}`, new zip.BlobReader(blobParts[i]));
                        const partZipBlob = await partZipWriter.close();

                        const mergedBlob = new Blob([coverBlob, partZipBlob], { type: finalMimeType });

                        const partName = `${baseName}_part${i + 1}${ext}`;
                        await masterZipWriter.add(partName, new zip.BlobReader(mergedBlob));
                    }

                    const finalDownloadBlob = await masterZipWriter.close();

                    const downloadUrl = URL.createObjectURL(finalDownloadBlob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = `${baseName}_split_images.zip`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(downloadUrl);

                    // 動態更新畫面的指令以包含正確的檔名
                    const winSplit = document.getElementById('cmd-win-split');
                    const linuxSplit = document.getElementById('cmd-linux-split');

                    if (winSplit && linuxSplit) {
                        const searchExt = ext || '.jpg';
                        winSplit.textContent = `FOR %I IN ("${baseName}_part*${searchExt}") DO tar -xf "%I"\ncopy /b ${baseName}_hidden.zip.* ${baseName}_final_hidden.zip`;
                        linuxSplit.textContent = `unzip -o '${baseName}_part*${searchExt}'\ncat ${baseName}_hidden.zip.* > ${baseName}_final_hidden.zip`;
                    }
                }

                msgEl.textContent = currentPassword ? `合併成功！ZIP 密碼為：${currentPassword}` : '合併成功！ZIP 未設定密碼';
                msgEl.className = 'mb-4 text-sm text-center text-green-500';
                msgEl.classList.remove('hidden');

            } catch (error) {
                msgEl.textContent = '處理失敗：' + error.message;
                msgEl.className = 'mb-4 text-sm text-center text-red-500';
                msgEl.classList.remove('hidden');
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.textContent = '壓縮合併並下載';
            }
        });

        const splitPartsInput = document.getElementById('splitPartsInput');
        const restoreMergeBtn = document.getElementById('restoreMergeBtn');
        const restoreMsgEl = document.getElementById('restoreMsg');

        restoreMergeBtn.addEventListener('click', async () => {
            const files = Array.from(splitPartsInput.files);
            if (files.length === 0) {
                restoreMsgEl.textContent = '請先選擇要合併的分割圖片檔案！';
                restoreMsgEl.className = 'mb-4 text-sm text-center text-red-500';
                restoreMsgEl.classList.remove('hidden');
                return;
            }

            restoreMsgEl.textContent = '處理中：讀取並提取碎片...';
            restoreMsgEl.className = 'mb-4 text-sm text-center text-blue-500';
            restoreMsgEl.classList.remove('hidden');
            restoreMergeBtn.disabled = true;
            restoreMergeBtn.textContent = '處理中...';

            try {
                let chunks = [];

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    let reader;
                    try {
                        reader = new zip.ZipReader(new zip.BlobReader(file));
                        const entries = await reader.getEntries();
                        if (entries.length === 0) throw new Error("Empty");

                        const entry = entries[0];
                        const filename = entry.filename;

                        const extMatch = filename.match(/\.(\d+)$/);
                        let partNum = i;
                        if (extMatch) partNum = parseInt(extMatch[1], 10);

                        const chunkData = await entry.getData(new zip.BlobWriter());
                        chunks.push({ num: partNum, data: chunkData, basename: filename.replace(/\.\d+$/, '') });
                        await reader.close();
                    } catch (e) {
                        throw new Error(`無法從 ${file.name} 讀取碎片，它可能不是正確的隱藏圖片。`);
                    }
                }

                chunks.sort((a, b) => a.num - b.num);

                const blobsToCombine = chunks.map(c => c.data);
                const finalZipBlob = new Blob(blobsToCombine, { type: 'application/zip' });

                let outFilename = chunks[0].basename || 'final_hidden.zip';
                if (!outFilename.endsWith('.zip')) outFilename += '.zip';

                const downloadUrl = URL.createObjectURL(finalZipBlob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = outFilename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);

                restoreMsgEl.textContent = '還原成功！已下載合併後的 ZIP 檔案。';
                restoreMsgEl.className = 'mb-4 text-sm text-center text-green-500';
                restoreMsgEl.classList.remove('hidden');

            } catch (error) {
                restoreMsgEl.textContent = '處理失敗：' + error.message;
                restoreMsgEl.className = 'mb-4 text-sm text-center text-red-500';
                restoreMsgEl.classList.remove('hidden');
                console.error(error);
            } finally {
                restoreMergeBtn.disabled = false;
                restoreMergeBtn.textContent = '開始還原合併並下載';
            }
        });
    </script>
